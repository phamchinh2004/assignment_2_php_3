[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/amazon/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/amazon/storage/logs/laravel-queue.log
stderr_logfile=/var/www/amazon/storage/logs/laravel-queue-error.log
stopwaitsecs=3600
priority=999

