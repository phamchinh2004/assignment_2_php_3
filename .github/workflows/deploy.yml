name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code từ GitHub
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Cài Node.js trên GitHub Actions
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Cài dependencies và build frontend
      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 4. Upload build lên hosting
      - name: Upload build to hosting
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "public/build/*"
          target: "/home/orderthe/public_html/build"
          strip_components: 2

      # 5. SSH vào hosting và cập nhật Laravel
      - name: Deploy Laravel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/orderthe/amazon

            git fetch origin main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader

            php artisan optimize:clear