name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Prepare SSH private key
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${SSH_PRIVATE_KEY_B64//[[:space:]]/}" ]; then
            echo "::error::SSH_PRIVATE_KEY_B64 is empty. Set this Actions secret to the base64-encoded SSH private key."
            exit 1
          fi

          if [[ "$SSH_PRIVATE_KEY_B64" == *"-----BEGIN "* ]]; then
            echo "::error::SSH_PRIVATE_KEY_B64 contains a raw key. Base64-encode the private key before saving this secret."
            exit 1
          fi

          if ! printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode > github_actions_key; then
            rm -f github_actions_key
            echo "::error::SSH_PRIVATE_KEY_B64 is invalid base64. Encode the original private-key file again and replace the entire secret value."
            exit 1
          fi

          chmod 600 github_actions_key
          if ! ssh-keygen -y -P '' -f github_actions_key > /dev/null 2>&1; then
            rm -f github_actions_key
            echo "::error::SSH_PRIVATE_KEY_B64 must decode to a valid SSH private key without a passphrase."
            exit 1
          fi

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 4. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 5. Build frontend
      - name: Build frontend
        env:
          VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
          VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}
        run: npm run build

      # 6. Prepare build directory
      - name: Prepare build
        run: |
          mkdir -p deploy_build
          cp -R public/build/. deploy_build/

      # 7. Prepare public static files
      - name: Prepare public assets
        run: |
          mkdir -p deploy_public
          cp -R public/. deploy_public/
          rm -f deploy_public/index.php deploy_public/.htaccess

      # 8. Upload frontend build
      - name: Upload build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key_path: github_actions_key
          source: "deploy_build/*"
          target: "/home/tiktosho/deploy_build"
          strip_components: 1

      # 9. Upload public static files
      - name: Upload public assets
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key_path: github_actions_key
          source: "deploy_public/*"
          target: "/home/tiktosho/deploy_public"
          strip_components: 1

      # 10. Deploy Laravel
      - name: Deploy Laravel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key_path: github_actions_key
          script: |
            set -e

            cd /home/tiktosho/tiktokshop

            echo "=== Update Laravel source ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Install PHP dependencies ==="
            composer install --no-dev --optimize-autoloader

            echo "=== Run database migrations ==="
            php artisan migrate --force

            echo "=== Update public static files ==="
            rm -f /home/tiktosho/deploy_public/index.php /home/tiktosho/deploy_public/.htaccess
            preserve_dir=$(mktemp -d)
            if [ -f /home/tiktosho/public_html/index.php ]; then
              cp -p /home/tiktosho/public_html/index.php "$preserve_dir/index.php"
            fi
            if [ -f /home/tiktosho/public_html/.htaccess ]; then
              cp -p /home/tiktosho/public_html/.htaccess "$preserve_dir/.htaccess"
            fi
            cp -R /home/tiktosho/deploy_public/. /home/tiktosho/public_html/
            if [ -f "$preserve_dir/index.php" ]; then
              cp -p "$preserve_dir/index.php" /home/tiktosho/public_html/index.php
            fi
            if [ -f "$preserve_dir/.htaccess" ]; then
              cp -p "$preserve_dir/.htaccess" /home/tiktosho/public_html/.htaccess
            fi
            rm -rf "$preserve_dir"

            echo "=== Link public storage ==="
            if [ -e /home/tiktosho/public_html/storage ] && [ ! -L /home/tiktosho/public_html/storage ]; then
              echo "ERROR: /home/tiktosho/public_html/storage exists and is not a symlink"
              exit 1
            fi
            ln -sfn /home/tiktosho/tiktokshop/storage/app/public /home/tiktosho/public_html/storage

            echo "=== Update frontend build ==="
            rm -rf /home/tiktosho/tiktokshop/public/build
            cp -R /home/tiktosho/deploy_build /home/tiktosho/tiktokshop/public/build
            rm -rf /home/tiktosho/public_html/build
            mv /home/tiktosho/deploy_build /home/tiktosho/public_html/build
          
            echo "=== Clear Laravel cache ==="
            php artisan optimize:clear

            echo "=== Deployment completed ==="
