name: Deploy Laravel App
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            APP_DIR=/var/www/amazon

            echo "🚀 Starting deployment..."
            cd $APP_DIR

            echo "🧹 Fixing permissions..."
            sudo chown -R apache:apache $APP_DIR

            echo "📥 Pulling code..."
            sudo -u apache git fetch --all
            sudo -u apache git reset --hard origin/main
            sudo -u apache git clean -fd

            echo "📦 Installing PHP dependencies..."
            sudo chown -R apache:apache vendor composer.lock composer.json || true
            sudo -u apache /usr/local/bin/composer install --no-dev --optimize-autoloader

            echo "🎨 Building frontend (full clean)..."
            sudo rm -rf node_modules package-lock.json
            sudo chown -R apache:apache $APP_DIR
            
            # NÊN thêm export PATH để tránh lỗi npm chạy sai node binary
            export PATH=$PATH:/usr/local/bin

            sudo -u apache npm install --legacy-peer-deps
            sudo -u apache npm rebuild
            sudo -u apache npm run build

            echo "🧭 Running Laravel tasks..."
            sudo -u apache php artisan migrate --force
            sudo -u apache php artisan optimize:clear
            sudo -u apache php artisan optimize

            echo "📌 Updating supervisor (reload queue worker)..."
            sudo cp queue.ini /etc/supervisord.d/laravel-queue.ini
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart laravel-queue:*

            echo "🔐 Fixing final permissions..."
            sudo chown -R apache:apache storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "🎯 Deployment done!"
