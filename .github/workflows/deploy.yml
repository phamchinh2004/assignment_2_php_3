name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        env:
          VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
          VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}
        run: npm run build

      # 5. Prepare build directory
      - name: Prepare build
        run: |
          mkdir -p deploy_build
          cp -R public/build/. deploy_build/

      # 6. Upload build to hosting
      - name: Upload build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy_build/*"
          target: "/home/orderthe/deploy_build"
          strip_components: 1

      # 7. Deploy Laravel + replace build
      - name: Deploy Laravel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e

            cd /home/orderthe/amazon

            echo "=== Update Laravel source ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Install PHP dependencies ==="
            composer install --no-dev --optimize-autoloader

            echo "=== Update frontend build ==="
            rm -rf /home/orderthe/public_html/build
            mv /home/orderthe/deploy_build /home/orderthe/public_html/build

            echo "=== Clear Laravel cache ==="
            php artisan optimize:clear

            echo "=== Deployment completed ==="