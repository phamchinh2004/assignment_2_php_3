<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9CA3AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B7280;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="75" cy="75" r="75" fill="url(#bgGradient)"/>
  
  <!-- User icon -->
  <circle cx="75" cy="60" r="25" fill="url(#iconGradient)"/>
  <path d="M45 120c0-16.569 13.431-30 30-30s30 13.431 30 30" fill="url(#iconGradient)"/>
  
  <!-- Border -->
  <circle cx="75" cy="75" r="75" fill="none" stroke="#9CA3AF" stroke-width="2"/>
</svg>
