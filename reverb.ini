[program:laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/amazon/artisan reverb:start --host=0.0.0.0 --port=6001
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/amazon/storage/logs/laravel-reverb.log
stderr_logfile=/var/www/amazon/storage/logs/laravel-reverb-error.log
stopwaitsecs=10
priority=998

